name: CI

on:
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        bazel_version:
          - "7.x"
          - "8.x"
          - "9.x"
          - "latest"
          - "rolling"
    env:
      USE_BAZEL_VERSION: ${{ matrix.bazel_version }}
    steps:
      - uses: actions/checkout@v4
      - run: bazel build //...
      - run: cd example && bazel test //... ${{ matrix.bazel_version == '7.x' && '--incompatible_use_plus_in_repo_names' || '' }}

  # Guards the asymptote, not an absolute byte count: the retained heap a single
  # library adds on top of its dependencies must not grow when the transitive
  # closure grows. Shape-based, so it survives the constants moving between Bazel
  # versions.
  #
  # Note what this does NOT cover. RunfilesGroupInfo lives on runfiles_group_aspect's
  # node, and `bazel dump --memory` can only address package:, configured_target:
  # and starlark_module: -- there is no way to name an aspect node. So this measures
  # the library rule's own providers, and a regression in runfiles_groups.collect()
  # would not be caught here. See "Keeping analysis memory flat" in the README.
  heap:
    runs-on: ubuntu-latest
    env:
      # `bazel dump --memory` does not exist before Bazel 8.
      USE_BAZEL_VERSION: "9.x"
    steps:
      - uses: actions/checkout@v4
      - name: retained heap per library is flat in closure size
        working-directory: example
        run: |
          set -euo pipefail
          # A fresh server per measurement: the graph persists across commands
          # and several Bazel interners are process-global, so measuring two
          # closures in one server cross-contaminates them.
          for n in 250 500; do
            bazel shutdown
            ../tools/shallow_bytes.sh "//stress:chain${n}_lib$((n - 1))" > "/tmp/shallow_${n}.txt"
          done
          python3 ../tools/heap_budget.py /tmp/shallow_250.txt /tmp/shallow_500.txt --max-growth 1.3
